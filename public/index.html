<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Tag Manager (GTM-NLGLRR3T) -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-NLGLRR3T"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
    </script>
    <!-- End Google Tag Manager -->
    <meta name="theme-color" content="#202735" />
    <meta name="description" content="20年分の発明を、もう一度マッシュアップ。ProtoPediaに投稿された作品を2つ配合し、AIが新しい発明アイデアを考える研究所。" />
    <!-- OGP: URL（og:url/og:image）は絶対URLが必要なため、ドメイン確定後に追加する（相対base運用のため） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mashup Ours" />
    <meta property="og:title" content="Mashup Ours — 20年分の発明を、もう一度マッシュアップ。" />
    <meta
      property="og:description"
      content="ProtoPediaに投稿された作品を2つ配合し、AIが新しい発明アイデアを考える研究所。生成されるのはすべて未実装のアイデアです。"
    />
    <meta name="twitter:card" content="summary" />
    <title>Mashup Ours — 20年分の発明を、もう一度マッシュアップ。</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // テーマの早期適用（白/黒フラッシュ防止）。保存 > OS設定 の順。
      (function () {
        try {
          var t = localStorage.getItem('mashup-theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var el = document.documentElement;
          el.dataset.theme = t;
          el.style.background = t === 'dark' ? '#202735' : '#FFF5DE';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#202735' : '#FFF5DE');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript は公式推奨: JS無効時の代替) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-NLGLRR3T"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
        title="Google Tag Manager"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <main id="app"></main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
