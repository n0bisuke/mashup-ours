# ProtoPedia作品の全件同期（docs/protopediaapi.md §6.1 / §7）。
# PROTOPEDIA_API_V2_TOKEN（Secrets）がない場合はスキップし、既存JSONを維持する。
# トークン取得: https://protopedia.net/settings/application
#
# 注意（追加開発指示 §5）: 試作段階では「全件収集を開始しない」。
# そのため定期実行は外し、手動 dispatch のみにしている。
# 15分ごとの候補は data/sample-prototypes.json（少数取得）から rotate-candidates が選ぶ。
# 全件同期を有効にするときだけ schedule を戻すこと。
name: Sync ProtoPedia works

on:
  workflow_dispatch:

# data/prototypes.json のコミットに必要な最小権限のみ。
# actions: write は Pages 再ビルドの dispatch 用（GITHUB_TOKEN の push は
# 他のワークフローを起動しないため、例外である workflow_dispatch で deploy.yml を呼ぶ / issue #40）。
permissions:
  contents: write
  actions: write

concurrency:
  group: sync-prototypes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # 依存インストールなし（スクリプトはNode標準ライブラリのみ使用）。
      # 同期失敗（終了コード1）でここでジョブが止まり、コミットされない =
      # 既存の data/prototypes.json がそのまま残る（キャッシュ保護）。
      - name: Sync from ProtoPedia API v2
        env:
          PROTOPEDIA_API_V2_TOKEN: ${{ secrets.PROTOPEDIA_API_V2_TOKEN }}
        run: |
          if [ -z "$PROTOPEDIA_API_V2_TOKEN" ]; then
            echo "::notice::PROTOPEDIA_API_V2_TOKEN が未設定のため同期をスキップしました（既存データをそのまま使用します）。"
            exit 0
          fi
          node --experimental-strip-types scripts/sync-protopedia.ts

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prototypes.json
          if git diff --cached --quiet; then
            echo "変更なし"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): ProtoPedia作品を同期 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 同期データの push でも Pages は再ビルドされないため、明示的に起動する（issue #40）。
      - name: Trigger Pages rebuild
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
