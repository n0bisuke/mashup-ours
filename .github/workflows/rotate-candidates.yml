# 配合候補の更新（追加開発指示 §7 / issue #10、間隔の設定化 issue #15）。
# 保存済みの作品データからスロット単位で最大 maxCandidates 件を決定的に選出し、
# data/current-candidates.json を更新する。ProtoPedia APIは呼ばない（トークン不要）。
# - 同じスロットなら常に同じ候補（枠内の再実行でも結果は同じ）
# - Actionsの実行遅延は generatedAt / slot を JSON に記録して UI 側で正直に表示する
# - 失敗時（プール0件・設定不正など）はジョブが止まり、既存の JSON は無変更
#
# 実行可否（issue #15 §3）: cron はJSONを読めないため、ワークフローは一定間隔で
# 「起床」するだけ。候補更新間隔（config/schedule.json の candidateRotationMinutes）と
# 前回生成（既存 slot）の比較による実行可否判定は、スクリプト側が行う。
# 判定を同じ枠ならスキップするため、手動実行（dispatch）も頻度制限を守り、
# Actionsの遅延があっても二重生成しない。
name: Rotate candidates

on:
  schedule:
    # 起床間隔は15分固定（:04/:19/:34/:49）。正時の高負荷を避けるため +4分。
    # 実効的な候補更新間隔は max(設定値 candidateRotationMinutes, 起床間隔)。
    # slot は設定間隔の境界（HHMM）へ切り下げられるので、遅延が数分なら同じ枠で再現する。
    # 表記は `4/15` ではなく列挙形（GitHubの公式ドキュメントはこの例を推奨する表記。
    # ステップ表現の schedule が一度も発火しなかったため、等価表現への変更で再アクティベート）。
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '候補スロット（YYYY-MM-DDTHHMM, UTC, 設定間隔の刻み）。省略時は実行時刻から算出'
        required: false

# data/current-candidates.json のコミットに必要な最小権限のみ。
# actions: write は Pages 再ビルドの dispatch 用（GitHub公式: GITHUB_TOKEN の push は
# 他のワークフローを起動しない。例外の workflow_dispatch で deploy.yml を呼ぶ）。
permissions:
  contents: write
  actions: write

concurrency:
  group: rotate-candidates
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # 依存インストールなし（スクリプトはNode標準ライブラリのみ使用）。
      # 手動 dispatch の slot 入力はシェルへ直接展開せず env 経由で渡す
      # （外部入力をコマンド文字列へ埋め込まない）。スクリプト側でも形式を検証する。
      - name: Rotate candidates
        env:
          SLOT_INPUT: ${{ inputs.slot }}
        run: |
          if [ -n "$SLOT_INPUT" ]; then
            node --experimental-strip-types scripts/rotate-candidates.ts --slot="$SLOT_INPUT"
          else
            node --experimental-strip-types scripts/rotate-candidates.ts
          fi

      - name: Commit updated candidates
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current-candidates.json
          if git diff --cached --quiet; then
            echo "変更なし"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): 配合候補を更新 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 候補データの push では Pages が再ビルドされない（GitHub公式:
      # GITHUB_TOKEN による push は他のワークフローをトリガーしない。
      # 例外である workflow_dispatch で deploy.yml を明示的に起動する / issue #40）。
      # コミットが発生したときだけ呼ぶ（Pages のデプロイ回数制限を消費しない）。
      - name: Trigger Pages rebuild
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice::候補データを更新したため deploy.yml を起動します"
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
