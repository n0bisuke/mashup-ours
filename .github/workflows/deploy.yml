# GitHub Pages へのビルド & デプロイ。
# 前提（手動設定）: Settings → Pages → Source を "GitHub Actions" にすること。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages デプロイに必要な最小権限のみ。
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを避けつつ、進行中のデプロイをキャンセルしない。
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # どのきっかけで起動したか・公開データの鮮度をログに残す（issue #40:
      # 「候補更新の遅延」「デプロイ失敗の原因」を Actions のログから検知できるようにする）。
      - name: Report trigger and data freshness
        run: |
          echo "trigger=${GITHUB_EVENT_NAME} sha=${GITHUB_SHA} ref=${GITHUB_REF_NAME}"
          node -e 'const fs=require("node:fs");const c=JSON.parse(fs.readFileSync("data/current-candidates.json","utf8"));const age=Math.round((Date.now()-new Date(c.generatedAt).getTime())/60000);console.log("candidates slot="+c.slot+" generatedAt="+c.generatedAt+" ("+age+"分前)");if(!(age>=0)||age>60)console.log("::warning::候補データの生成から"+age+"分経過しています（rotate-candidates の遅延・未実行の可能性）");const off=JSON.parse(fs.readFileSync("data/offspring.json","utf8"));const last=off.map((o)=>o.createdAt).sort().pop();if(last)console.log("offspring latest="+last);'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate data
        run: npm run validate-data

      - name: Build
        run: npm run build
        env:
          # base パスと Issue リンクをリポジトリから自動導出する
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # 失敗しても原因の見出しをログに出す（issue #40: 失敗時に原因が Actions のログから分かる）。
      - name: Failure summary
        if: failure()
        run: |
          echo "::error::Pages デプロイのビルド/検証に失敗しました。失敗したステップとそのログを確認してください（tests / validate-data / build）。"
          echo "::error::run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
