# 発明の配合（issue #16 / 追加開発指示 §11）。
# Cloudflare Workers AI（gpt-oss-20b）で発明を1件生成し、FLUX.1 schnellでサムネイルを1枚生成。
# data/ と public/static/assets/inventions/ をコミットし、結果をIssueへコメントしてクローズする。
#
# 実行可否（issue #15 / 追加開発指示 §10 / 時間帯別配合 issue #41）:
# cron はJSONを読めないため、ワークフローは時刻表に合わせて「起床」するだけ。
# どの枠か・連続失敗冷却・日次AI上限の判定は scripts/process-breeding.ts が
# config/schedule.json（breedingWindows）+ data/breeding-state.json で行う。
#   - 同じ枠で二重生成しない（成功した枠を lastSlot に永続化）
#   - 1回の実行は**現在の1枠だけ**を見る（遅延しても過去の枠をまとめて処理しない）
# cron の正時厳密実行は保証しない（下は「起床」時刻であり、実行はスクリプトが判断）。
#
# 手動実行（workflow_dispatch）の dry_run は既定 true:
#   AI呼び出し・データ書き込み・Issue操作をすべて禁止（本番枠も消費しない）。
name: Breed (Workers AI)

on:
  schedule:
    # 時間帯別配合（issue #41 / JST = UTC+9。config/schedule.json の breedingWindows）:
    #   13:00〜21:00 JST = 30分枠 / 21:00〜翌13:00 JST = 2時間枠（1日24枠）。
    # ここに書くのは**起床時刻**。予定時刻ちょうどの実行は保証しない（Actionsの遅延・
    # 正時の高負荷を避けるため :06 から始め、枠ごとに2回目を置く = 失敗時の再試行枠）。
    # 表記は `6/15` のステップ形ではなく列挙形（ステップ表現の schedule が一度も発火しなかったため）。
    #
    # 30分枠（JST 13:00/13:30/…/20:30 = UTC 04:00〜11:30 の枠開始）: 毎時 :06 と :21 に起床
    - cron: '6,21 4-11 * * *'
    # 2時間枠（JST 21:00/23:00/…/翌11:00 = UTC 12,14,16,18,20,22,0,2 の枠開始）:
    # 枠開始の :06 と、30分後の :36（同じ枠内での再試行）
    - cron: '6,36 0,2,12,14,16,18,20,22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（AI呼び出し・データ書き込み・Issue操作をすべて禁止）'
        type: boolean
        default: true

# Issue対応とJSON/画像コミットに必要な最小権限のみ（ジョブ単位）。
permissions: {}

concurrency:
  # 直列化: 同時実行・再実行があっても時間帯ごとの枠上限（1日24枠）を破らない（AGENTS.md）。
  group: breed
  cancel-in-progress: false

jobs:
  breed:
    runs-on: ubuntu-latest
    permissions:
      contents: write # data/・画像のコミット
      issues: write # 却下/失敗コメント（スクリプト経由）と結果コメント・クローズ
      # Pages 再ビルドの dispatch 用（公式: GITHUB_TOKEN の push は他の workflow を
      # 起動しない。例外の workflow_dispatch で deploy.yml を呼ぶため actions: write）。
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # sharp（画像PNG変換）を使うため依存インストールが必要。
      - name: Install dependencies
        run: npm ci

      # 外部入力（Issue本文等）はシェル・Actions式へ埋め込まない（スクリプトがAPIから取得）。
      # Secrets は env のみ（ログ・ファイル・フロントへは出さない）。
      # DRY_RUN: schedule実行は空文字（=本番）、dispatchは入力値 true/false。
      - name: Process breeding request
        id: breed
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node --experimental-strip-types scripts/process-breeding.ts

      # コミットは失敗時（exit 1）でも行う: 失敗記録（processed-issues / breeding-state /
      # 利用量 / キャッシュ）を残さないと、同じ失敗を無限に再処理してしまうため。
      # dry-run はスクリプトが一切書かないため差分自体が出ない。
      - name: Commit results
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/static/assets/inventions/
          if git diff --cached --quiet; then
            echo "変更なし"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "feat(data): 発明の配合結果を追加 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 配合結果の push では Pages が再ビルドされない（GitHub公式:
      # GITHUB_TOKEN による push は他の workflow をトリガーしない）。
      # 例外である workflow_dispatch で deploy.yml を明示的に起動する。
      # コミットが発生した**かつ**新しい発明が生まれたときだけ呼ぶ
      # （キャッシュ再利用 reused のコミットは processed-issues のみ = 公開内容は不変）。
      - name: Trigger Pages rebuild
        if: ${{ steps.commit.outputs.changed == 'true' && steps.breed.outputs.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"

      # 結果コメント＆クローズは**コミット成功の後**（AGENTS.md: コミット後にIssueへリンク）。
      # 本文はスクリプトが書いたファイルを --body-file で読む = AI出力を shell へ埋め込まない。
      # reused（同じ配合条件のキャッシュヒット / issue #37）も正常処理として同じ経路で完了する。
      - name: Comment result on issue
        if: ${{ steps.breed.outputs.outcome == 'success' || steps.breed.outputs.outcome == 'reused' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.breed.outputs.issue_number }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file tmp/breed-report.md
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason "completed"
